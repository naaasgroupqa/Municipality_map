<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#65052f" />
    <title>Qatar Historical Places | Ministry of Municipality</title>
    <style>
      /* Full Ministry logo from web source; keep complete mark visible */
      .topbar{min-height:96px!important;background:#fff!important}
      .brand-lockup{
        width:230px!important;
        height:90px!important;
        overflow:visible!important;
        flex:0 0 230px!important;
        background:#fff url('https://www.mangusteen.com/wp-content/uploads/2022/04/Baladiya.png') left center/86px 86px no-repeat!important;
        position:relative!important;
      }
      .brand-lockup::after{
        content:'Ministry of Municipality';
        position:absolute;
        left:96px;
        top:36px;
        white-space:nowrap;
        color:#111;
        font:700 14px/1.1 Arial,sans-serif;
      }
      .brand-lockup img{display:none!important}
      @media(max-width:1180px){
        .brand-lockup{width:205px!important;flex-basis:205px!important;background-size:78px 78px!important}
        .brand-lockup::after{left:86px;top:37px;font-size:12px}
      }
      @media(max-width:850px){
        .brand-lockup{width:92px!important;flex-basis:92px!important;background-size:72px 72px!important}
        .brand-lockup::after{display:none}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
